<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="TabMaster logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5AA2FF"/>
      <stop offset="1" stop-color="#2451E0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <clipPath id="clip"><rect width="96" height="96" rx="22"/></clipPath>
  </defs>
  <!-- Chrome Web Store icon rule: 96 x 96 artwork with 16 px transparent padding on a 128 canvas -->
  <g transform="translate(16 16)">
    <rect width="96" height="96" rx="22" fill="url(#tile)"/>
    <rect width="96" height="96" rx="22" fill="url(#gloss)"/>
    <g clip-path="url(#clip)">
      <!-- the tab strip the tab sits on -->
      <rect x="0" y="68" width="96" height="28" fill="#0A1F7A" opacity="0.22"/>
      <!-- one browser tab: rounded top, flared foot -->
      <path d="M11 68A9 9 0 0 0 20 59V38A12 12 0 0 1 32 26H64A12 12 0 0 1 76 38V59A9 9 0 0 0 85 68Z" fill="#0A1F7A" opacity="0.25" transform="translate(0 3)"/>
      <path d="M11 68A9 9 0 0 0 20 59V38A12 12 0 0 1 32 26H64A12 12 0 0 1 76 38V59A9 9 0 0 0 85 68Z" fill="#FFFFFF"/>
      <!-- favicon, a new title and the text cursor of someone typing it -->
      <circle cx="33" cy="48" r="7.5" fill="url(#amber)"/>
      <rect x="45" y="44" width="19" height="8" rx="4" fill="#2B5BE8"/>
      <rect x="67" y="39" width="4" height="18" rx="2" fill="url(#amber)"/>
    </g>
  </g>
</svg>
