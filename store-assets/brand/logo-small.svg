<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="TabMaster logo (small sizes)">
  <!-- Variant for the 16, 32 and 48 px toolbar icons: tile fills the canvas, bolder tab and cursor -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5AA2FF"/>
      <stop offset="1" stop-color="#2451E0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="94" height="94" rx="21"/></clipPath>
  </defs>
  <rect x="1" y="1" width="94" height="94" rx="21" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <rect x="0" y="72" width="96" height="24" fill="#0A1F7A" opacity="0.22"/>
    <path d="M5 72A9 9 0 0 0 14 63V35A13 13 0 0 1 27 22H69A13 13 0 0 1 82 35V63A9 9 0 0 0 91 72Z" fill="#FFFFFF"/>
    <circle cx="31" cy="50" r="9" fill="url(#amber)"/>
    <rect x="45" y="44" width="22" height="12" rx="6" fill="#2B5BE8"/>
    <rect x="71" y="38" width="5.5" height="24" rx="2.75" fill="url(#amber)"/>
  </g>
</svg>
