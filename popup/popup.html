<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Master</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <img src="../icons/icon48.png" alt="" width="24" height="24">
      <h1>Tab Master</h1>
    </div>
    <button id="openSettingsBtn" class="btn-icon" title="Manage all rules" aria-label="Manage all rules">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="8" cy="8" r="2.2"/>
        <path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/>
      </svg>
    </button>
  </header>

  <main class="content">
    <p class="description">Rename this tab and give it its own icon.</p>

    <form id="quickAddForm" class="quick-form">
      <div class="form-group">
        <label for="conditionType">When the address</label>
        <div class="input-row">
          <select id="conditionType">
            <option value="startsWith">starts with</option>
            <option value="endsWith">ends with</option>
            <option value="contains">contains</option>
            <option value="exact">is exactly</option>
          </select>
          <input type="text" id="conditionValue" required aria-label="Address text" spellcheck="false">
        </div>
        <div id="suggestions" class="suggestions-container hidden"></div>
      </div>

      <div class="form-group">
        <label for="actionTitle">Tab name</label>
        <input type="text" id="actionTitle" placeholder="Keep original name">
      </div>

      <div class="form-group">
        <label for="actionEmoji">Icon (emoji)</label>
        <input type="text" id="actionEmoji" placeholder="e.g. 💻" maxlength="5">
        <small class="hint">For your own image, open the dashboard.</small>
      </div>

      <button type="submit" id="saveRuleBtn" class="primary-btn">Save rule</button>
    </form>

    <div id="successMessage" class="success-message hidden" role="status">Rule saved</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
